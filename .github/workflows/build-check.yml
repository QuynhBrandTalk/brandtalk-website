name: build-check

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build, capturing everything
        run: |
          set +e
          {
            echo "===== npm install ====="
            npm install 2>&1
            echo "===== INSTALL EXIT: $? ====="
            echo "===== next build ====="
            npx next build 2>&1
            echo "===== BUILD EXIT: $? ====="
          } > /tmp/build.log
          tail -5 /tmp/build.log
          exit 0

      - name: Publish log to build-log branch
        if: always()
        run: |
          git config user.name "build-check"
          git config user.email "build-check@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "build log for ${GITHUB_SHA}"
          git push -f origin build-log
